<!--
CODING MAP (for the real build: React + Tailwind + lucide-react)
 Shell        : TopBar, SideRail, SettingsHeader, SettingsNav, RightRail            -> shell(), settingsShell()
 Shared UI    : Btn, Tabs, Bar(title+actions), Popover/Dropdown, Modal, DataTable, EmptyState, FormGrid, Field, StickyFooter
 Items module : ItemsList(list|grid), ItemDetail(tabs), NewItemForm, CompositeList/NewComposite, BomList/BomDetail,
                Products/Plans/Addons (+detail, +new), PriceLists (+lifecycle, +new), PricingWidgets, Coupons (+detail tabs, +new)
 Settings     : SettingsHome (cards), ItemsSettings: Preferences (sticky Save footer) | Fields (+NewField page, ConfigureAccess modal) |
                ValidationRules (+new page) | RecordLocking (+modal) | Buttons (+modal) | RelatedLists (+new page)
 State        : S = saved preferences, D = draft; X = fields/rules/locks/buttons/lists; effectsOf() maps a saved change to the Items screen + field to highlight.

-->

function plansHead(label,menu,newAct){return `<div class=bar><button class=ttl data-a="popPD">${label} ▾</button><button class=btn data-a="sub" data-v="${label.includes('Product')?'Plans':'Products'}">${label.includes('Product')?'Plans':'Products'}</button><span class=sp></span><button class="btn pri" data-a="${newAct}">+ New</button><button class=btn data-a="noop">⋯</button></div>`}
function plansMain(){
 const s=V.sub,sc=V.screen;
 const popDD=V.pop==='pd'?(s==='Plans'?ddMenu(['All','Active','Inactive'],'noop','All'):s==='Addons'?ddMenu(['All','Active','Inactive','Recurring','One Time'],'noop','All'):ddMenu(['All','Active','Inactive'],'noop','All')):'';
 if(sc==='newprod')return prodModal()+plansMainList();
 if(sc==='newplan'||sc==='newaddon')return planForm(sc==='newplan');
 if(sc==='plan')return planDetail();if(sc==='addon')return addonDetail();if(sc==='product')return productDetail();

function plansMainList(){const s=V.sub;
 if(s==='Plans'){const r=dat(B.plans);return `<div class=pane>${plansHead('All Plans',0,'newPlan')}${r.length?`<table><thead><tr><th>PLAN</th><th>PRODUCT</th><th>PLAN CODE</th><th>DESCRIPTION</th><th>STATUS</th><th>PRICING MODEL</th><th>BILLING FREQUENCY</th><th>PRICE</th></tr></thead><tbody>${r.map((p,i)=>`<tr class=row data-a="planOpen" data-v="${i}"><td><a class=lk>${esc(p.plan)}</a></td><td>${esc(p.product)}</td><td>${p.code}</td><td></td><td>${p.status}</td><td>${p.model}</td><td>${p.freq}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table>`:`<div class=empty><h3>Create tailor-made plans for any pricing model</h3>You can create multiple plans for each of your subscription items. Leverage the extensive pricing models and customizations available to experiment with ease.<br><br><button class="btn pri" data-a="newPlan">+ New Plan</button></div>`}</div>`}
 if(s==='Addons'){const r=dat(B.addons);return `<div class=pane>${plansHead('All Addons',0,'newAddon')}${r.length?`<table><thead><tr><th>NAME</th><th>PRODUCT</th><th>ADDON CODE</th><th>DESCRIPTION</th><th>STATUS</th><th>ADDON TYPE</th><th>PRICING MODEL</th><th>BILLING FREQUENCY</th><th>PLAN</th><th>PRICE</th></tr></thead><tbody>${r.map((p,i)=>`<tr class=row data-a="addonOpen" data-v="${i}"><td><a class=lk>${esc(p.name)}</a></td><td>${esc(p.product)}</td><td>${p.code}</td><td></td><td>${p.status}</td><td>${p.type}</td><td>${p.model}</td><td>${p.freq}</td><td>${p.plan}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table>`:`<div class=empty><h3>Pack extra value into subscriptions</h3>Addons can be either one-time or recurring, and can be configured for various pricing models.<br><br><button class="btn pri" data-a="newAddon">+ New Addon</button></div>`}</div>`}

 return `<div class=pane><div class=bar><h2>${pl?'Add Plan':'Add Addon'}</h2><span class=sp></span><button class=btn data-a="cancelPlan" aria-label=Close>${ic('x')}</button></div><div class="form hf"><div class=fg><label class=f><span class=req>Product</span><select id=f_prod>${B.products.map(p=>`<option ${p.name===V.form?.prod?'selected':''}>${esc(p.name)}</option>`).join('')||'<option>Select Product</option>'}</select></label><label class=f><span class=req>${pl?'Plan':'Addon'} Name</span><input type=text id=f_name></label><label class=f><span class=req>${pl?'Plan':'Addon'} Code</span><input type=text id=f_code></label>${pl?'<label class=f>Billing Frequency<div style="display:flex;gap:4px"><input type=number value=1><select><option>Month(s)</option></select></div></label><label class=f><span class=req>Billing Cycles</span><select><option>Auto-renews until canceled</option><option>Fixed number of cycles</option></select></label>':'<label class=f>Addon Type<span><input type=radio name=at> One-time &nbsp;<input type=radio name=at checked> Recurring</span></label><label class=f><span class=req>Pricing Interval</span><select><option>Month(s)</option></select></label>'}<label class=f>${pl?'Plan':'Addon'} Description<textarea rows=2></textarea></label></div><div class=fs><div class=tabs>${T.map((x,i)=>`<button class="${V.ptab===i?'on':''}" data-a="ptab" data-v="${i}">${x}</button>`).join('')}</div><div style="padding-top:10px">${tc[tb]}</div></div></div><div class=sfoot><button class="btn pri" data-a="${pl?'savePlan':'saveAddon'}">Save</button><button class=btn data-a="cancelPlan">Cancel</button></div></div>`}

function mdLayout(o){return `<div class=split><div class=lpane style="width:340px"><div class=bar style="padding:14px 16px;border:0"><button class=ttl data-a="${o.pop||'noop'}" style="font-size:18px">${o.title} ▾</button><span class=sp></span><button class="btn pri sqr" data-a="${o.newAct}" aria-label=New>${ic('plus')}</button><button class="btn sqr" data-a="noop" aria-label="More Actions">⋯</button></div>${o.rows}</div><div class=pane style="background:var(--soft)">${o.detail}</div></div>`}
function mdHead(title,closeAct,extra){return `<div style="background:var(--panel);padding:16px 20px;display:flex;align-items:center;gap:10px"><h2 style="margin:0;font-size:22px;font-weight:500">${title}</h2><span class=sp></span>${extra||''}<button class="btn sqr" style="color:var(--bad)" data-a="${closeAct}" aria-label=Close>${ic('x')}</button></div>`}
function mdBar(items){return `<div class=tbar>${items.map(([l,a,v])=>`<button data-a="${a||'noop'}" data-v="${v||''}">${l}</button>`).join('')}</div>`}
function mdRow(on,act,v,top,sub,badge){return `<div class="lrow ${on?'on':''}" data-a="${act}" data-v="${v}"><div style="display:flex;gap:6px"><input type=checkbox aria-label=Select><b style="font-weight:500;flex:1">${top[0]}</b><b style="font-weight:500">${top[1]||''}</b></div>${sub?`<div style="display:flex;padding-left:22px"><small style="flex:1">${sub[0]}</small><small>${sub[1]||''}</small></div>`:''}${badge?`<div style="padding-left:22px">${badge}</div>`:''}</div>`}
const stBadge=s=>`<small style="color:${s==='Active'?'var(--ok)':'var(--mute)'};font-weight:600">${s.toUpperCase()}</small>`;
const ribbonCard=(st,inner)=>`<div class=mdcard><span class=rib style="background:${st==='Active'?'#2f7d32':'#6b7280'}">${st}</span>${inner}</div>`;
const tabCard=(tabs,cur,act,body)=>`<div class=mdcard style="padding:0"><div class=tabs style="background:none;padding:6px 20px 0">${tabs.map((x,i)=>`<button class="${cur===i?'on':''}" data-a="${act}" data-v="${i}">${x}</button>`).join('')}</div><div>${body}</div></div>`;
const dkv=a=>`<div style="display:grid;grid-template-columns:170px 1fr;gap:10px;padding:5px 0;font-size:13.5px"><span class=mut>${a[0]}</span><span>${a[1]}</span></div>`;
